version: '3.8'

# ============================================================
# Hugging Face Integration for Docker Compose
# ============================================================
#
# Add to docker-compose.yml to enable Hugging Face support
#

services:
  openclaw-gateway:
    # Add these environment variables:
    environment:
      # Hugging Face Configuration
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN}
      HF_HOME: /home/node/.cache/huggingface
      HF_DATASETS_CACHE: /home/node/.cache/huggingface/datasets

      # Model Configuration
      HF_TEXT_MODEL: ${HF_TEXT_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
      HF_IMAGE_MODEL: ${HF_IMAGE_MODEL:-stabilityai/stable-diffusion-3-medium}

      # Performance Settings
      HF_OFFLINE_MODE: ${HF_OFFLINE_MODE:-false}

    # Add these volumes:
    volumes:
      # Existing volumes...
      # Add Hugging Face model cache
      - hf_cache:/home/node/.cache/huggingface
      # Datasets cache
      - hf_datasets:/home/node/.cache/huggingface/datasets
  # Optional: For monitoring, create monitoring/prometheus.yml
  # Then uncomment hf-monitor service below
  # hf-monitor:
  #   image: quay.io/prometheus/prometheus:latest
  #   container_name: hf-monitor
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - hf_metrics:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #   depends_on:
  #     - openclaw-gateway
  #   restart: unless-stopped

  # Volumes for Hugging Face
volumes:
  hf_cache:
    driver: local
  hf_datasets:
    driver: local
  # hf_metrics:  # Uncomment when enabling hf-monitor service
  #   driver: local

  # ============================================================
  # Usage Instructions
  # ============================================================
  #
  # 1. Add this file to your docker-compose.yml (merge the services)
  #
  # 2. Make sure .env contains:
  #    HUGGINGFACE_API_TOKEN=hf_xxxxxxxxxxxxx
  #    HF_TEXT_MODEL=mistralai/Mistral-7B-Instruct-v0.2
  #    HF_IMAGE_MODEL=stabilityai/stable-diffusion-3-medium
  #
  # 3. Start containers:
  #    docker-compose up -d
  #
  # 4. Check logs:
  #    docker logs openclaw-gateway
  #
  # 5. Test endpoints:
  #    curl -X POST http://localhost:19002/api/hf-generate \
  #      -H 'Content-Type: application/json' \
  #      -d '{"prompt": "Hello!"}'
  #
  # ============================================================
  # Performance Tuning
  # ============================================================
  #
  # For large models, add to openclaw-gateway:
  #
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 8G
  #       reservations:
  #         memory: 4G
  #
  # For GPU support, add:
  #
  #   runtime: nvidia
  #   environment:
  #     CUDA_VISIBLE_DEVICES: 0
  #
  # ============================================================
